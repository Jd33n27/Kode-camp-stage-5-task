<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Original UI</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <!-- Top Bar & Menu -->
    <div class="top-bar">
      <button id="menu-toggle" class="icon-btn menu-toggle-btn" title="Open Menu"><i class="fa-solid fa-bars"></i></button>
      
      <div class="top-menu" id="top-menu">
        <button id="theme-toggle" class="menu-item">
          <i class="fa-solid fa-moon"></i> <span>Dark Mode</span>
        </button>
        
        <div class="menu-item select-menu-item">
          <i class="fa-solid fa-bell"></i>
          <select id="alarm-selector" class="alarm-dropdown" title="Choose Alarm Tone">
            <option value="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">Digital Tone</option>
            <option value="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3">Classic Tone</option>
            <option value="https://assets.mixkit.co/active_storage/sfx/1054/1054-preview.mp3">Chime</option>
            <option value="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3">Bell</option>
          </select>
        </div>

        <button id="toggle-pomodoro" class="menu-item">
          <i class="fa-solid fa-stopwatch"></i> <span>Pomodoro</span>
        </button>
        
        <button id="export-btn" class="menu-item">
          <i class="fa-solid fa-floppy-disk"></i> <span>Export Tasks</span>
        </button>
        
        <label for="import-file" class="menu-item" style="cursor: pointer;">
          <i class="fa-solid fa-folder-open"></i> <span>Import Tasks</span>
        </label>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h1 class="heading"><i class="fa-solid fa-list-check"></i> Task Manager</h1>
        <p>Stay organized and productive!</p>
      </div>

      <div class="main-content">
        <!-- Hidden Pomodoro -->
        <div class="pomodoro-section" id="pomodoro-section" style="display: none;">
          <h2><i class="fa-solid fa-clock"></i> Pomodoro Timer</h2>
          <div class="pomodoro-timer" id="pomodoro-time">25:00</div>
          <div class="pomodoro-controls">
            <button class="btn btn-primary" id="pomodoro-start">Start</button>
            <button class="btn btn-secondary" id="pomodoro-reset">Reset</button>
          </div>
        </div>

        <div class="search-section">
          <input type="text" id="search-input" class="search-input" placeholder="Search tasks..." />
        </div>

        <div class="input-section">
          <input type="text" id="task-input" class="task-input" placeholder="Add a new task..." maxlength="100" />
          <textarea id="task-desc" class="task-input task-desc-input" placeholder="Add details or notes..."></textarea>
          
          <div class="input-row-options">
            <input type="datetime-local" id="task-date" class="task-date" title="Set a Reminder" />
            <select id="task-priority" class="task-priority">
              <option value="Low">Low Priority</option>
              <option value="Medium" selected>Medium Priority</option>
              <option value="High">High Priority</option>
            </select>
            <button id="add-btn" class="btn btn-primary">Add Task</button>
          </div>
        </div>

        <div class="tasks-unified-section">
          <div class="task-stats">
            <div class="stat">
              <div class="stat-number" id="total-tasks">0</div>
              <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
              <div class="stat-number" id="completed-tasks">0</div>
              <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
              <div class="stat-number" id="pending-tasks">0</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>

          <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>

          <ul id="task-list" class="task-list"></ul>

          <div id="empty-state" class="empty-state" style="display: none">
            <div style="font-size: 4em; margin-bottom: 10px; color: var(--secondary-text); opacity: 0.5;"><i class="fa-solid fa-check-circle"></i></div>
            <p>No tasks yet. Add one above to get started!</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PWA Install Modal -->
    <div id="install-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>Install App <i class="fa-solid fa-mobile-screen-button"></i></h3>
        <p>Install this task manager on your device for quick access and offline use!</p>
        <div class="modal-actions">
          <button id="install-accept" class="btn btn-primary">Install</button>
          <button id="install-decline" class="btn btn-secondary">Not Now</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script src="./script.js"></script>
  </body>
</html>
