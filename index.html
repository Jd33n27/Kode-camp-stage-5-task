<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Minimalist</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="app-title"><i class="fa-solid fa-check"></i> Tasks</div>
      <div class="data-tools">
        <button id="toggle-pomodoro" class="icon-btn" title="Pomodoro Timer"><i class="fa-solid fa-stopwatch"></i></button>
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button id="export-btn" class="icon-btn" title="Export (Download)"><i class="fa-solid fa-download"></i></button>
        <label for="import-file" class="icon-btn" title="Import (Upload)" style="cursor: pointer;"><i class="fa-solid fa-upload"></i></label>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
      </div>
    </div>

    <div class="container">
      
      <!-- Hidden Pomodoro -->
      <div class="pomodoro-section" id="pomodoro-section" style="display: none;">
        <div class="pomodoro-timer" id="pomodoro-time">25:00</div>
        <div class="pomodoro-controls">
          <button class="btn btn-primary" id="pomodoro-start">Start</button>
          <button class="btn btn-secondary" id="pomodoro-reset">Reset</button>
        </div>
      </div>

      <!-- Add Task Section -->
      <div class="add-task-container">
        <div class="input-row">
          <input type="text" id="task-input" class="clean-input" placeholder="Add a new task..." maxlength="100" style="padding-left: 8px; font-weight: bold; font-size: 18px;" />
        </div>
        <div class="task-details-input" id="task-details-section" style="margin-left: 0;">
          <textarea id="task-desc" class="clean-input text-small" placeholder="Add details or notes..."></textarea>
          <div class="task-options-row" style="justify-content: space-between;">
            <div style="display: flex; gap: 12px;">
              <input type="datetime-local" id="task-date" class="clean-date" title="Set a Reminder" />
              <select id="task-priority" class="clean-select">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
              </select>
            </div>
            <button id="add-btn" class="btn btn-primary">Add Task</button>
          </div>
        </div>
      </div>

      <div class="search-section">
        <input type="text" id="search-input" class="clean-input search-input" placeholder="Search tasks..." />
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state" style="display: none">
        <div class="empty-icon"><i class="fa-solid fa-check-circle"></i></div>
        <p>All tasks completed!</p>
      </div>
    </div>

    <div id="install-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>Install App <i class="fa-solid fa-mobile-screen-button"></i></h3>
        <p>Install this task manager on your device for quick access and offline use!</p>
        <div class="modal-actions">
          <button id="install-accept" class="btn btn-primary">Install</button>
          <button id="install-decline" class="btn btn-secondary">Not Now</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    
    <!-- Alarm Sound -->
    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="./script.js"></script>
  </body>
</html>
